<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@300;700;900&family=Open+Sans:wght@400;600&display=swap');
            
            /* 定义CSS变量 */
            :root {
                --bg-color: #ffffff;
                --text-main: #333333;
                --primary: #1e3a8a;
                --accent: #0d9488;
                --light-gray: #f3f4f6;
                --border-color: #e5e7eb;
            }
            
            /* 文本样式类 */
            .journal-badge {
                font-family: 'Merriweather', serif;
                font-size: 18px;
                font-weight: 700;
                fill: var(--accent);
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            
            .title {
                font-family: 'Merriweather', serif;
                font-size: 46px;
                font-weight: 900;
                fill: var(--primary);
                line-height: 1.25;
            }
            
            .authors {
                font-family: 'Open Sans', sans-serif;
                font-size: 22px;
                fill: #555555;
            }
            
            .author-highlight {
                fill: var(--primary);
                font-weight: 700;
            }
            
            .affiliations {
                font-family: 'Open Sans', sans-serif;
                font-size: 18px;
                fill: #777777;
                font-style: italic;
            }
            
            .section-title {
                font-family: 'Merriweather', serif;
                font-size: 26px;
                font-weight: 700;
                fill: var(--primary);
            }
            
            .body-text {
                font-family: 'Open Sans', sans-serif;
                font-size: 21px;
                fill: var(--text-main);
                line-height: 1.6;
            }
            
            .key-findings {
                font-family: 'Open Sans', sans-serif;
                font-size: 20px;
                fill: var(--text-main);
                line-height: 1.5;
            }
            
            .key-findings strong {
                fill: var(--accent);
                font-weight: 700;
            }
            
            .stat-number {
                font-family: 'Merriweather', serif;
                font-size: 56px;
                font-weight: 900;
                fill: white;
            }
            
            .stat-label {
                font-family: 'Open Sans', sans-serif;
                font-size: 18px;
                fill: white;
                opacity: 0.9;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            
            .footer-text {
                font-family: 'Open Sans', sans-serif;
                font-size: 18px;
                fill: #888888;
            }
            
            .doi-link {
                fill: var(--primary);
                text-decoration: none;
            }
            
            .superscript {
                font-size: 70%;
                baseline-shift: super;
            }
            
            .subscript {
                font-size: 70%;
                baseline-shift: sub;
            }
        </style>
        
        <!-- 定义箭头标记 -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#0d9488"/>
        </marker>
    </defs>
    
    <!-- 背景和边框 -->
    <rect width="1080" height="1080" fill="white"/>
    <rect x="0" y="0" width="1080" height="1080" fill="none" stroke="var(--primary)" stroke-width="10"/>
    <rect x="0" y="0" width="1080" height="12" fill="var(--primary)"/>
    
    <!-- 内容容器 -->
    <g transform="translate(60, 50)">
        <!-- Header区域 -->
        <text x="480" y="30" text-anchor="middle" class="journal-badge">
            Physical Review Letters 133, 046802 (2024)
        </text>
        
        <text x="480" y="120" text-anchor="middle" class="title">
            <tspan x="480" dy="0">Giant Piezoelectric Effects of</tspan>
            <tspan x="480" dy="57.5">Topological Structures in Stretched</tspan>
            <tspan x="480" dy="57.5">Ferroelectric Membranes</tspan>
        </text>
        
        <text x="480" y="260" text-anchor="middle" class="authors">
            <tspan class="author-highlight">Yihao Hu<tspan class="superscript">1</tspan></tspan>
            <tspan dx="10">,</tspan>
            <tspan dx="10" class="author-highlight">Jiyuan Yang<tspan class="superscript">1</tspan></tspan>
            <tspan dx="10">, and</tspan>
            <tspan dx="10" class="author-highlight">Shi Liu<tspan class="superscript">1,2,*</tspan></tspan>
        </text>
        
        <text x="480" y="300" text-anchor="middle" class="affiliations">
            1. Westlake University  |  2. Westlake Institute for Advanced Study
        </text>
        
        <!-- Header底部边框 -->
        <line x1="0" y1="340" x2="960" y2="340" stroke="var(--light-gray)" stroke-width="2"/>
        
        <!-- 内容主体 (两列布局) -->
        <g transform="translate(0, 380)">
            <!-- 左列 -->
            <g transform="translate(0, 0)">
                <!-- The Context -->
                <g transform="translate(0, 0)">
                    <text x="0" y="0" class="section-title">The Context</text>
                    <line x1="0" y1="35" x2="150" y2="35" stroke="var(--accent)" stroke-width="2"/>
                    <text x="0" y="80" class="body-text" width="420">
                        <tspan x="0" dy="0">Freestanding ferroelectric oxide membranes are</tspan>
                        <tspan x="0" dy="33.6">emerging as a promising platform for exploring</tspan>
                        <tspan x="0" dy="33.6">the interplay between topological polar ordering</tspan>
                        <tspan x="0" dy="33.6">and dipolar interactions. These interactions can be</tspan>
                        <tspan x="0" dy="33.6">continuously tuned by strain, offering new pathways</tspan>
                        <tspan x="0" dy="33.6">for material engineering.</tspan>
                    </text>
                </g>
                
                <!-- Methodology -->
                <g transform="translate(0, 250)">
                    <text x="0" y="0" class="section-title">Methodology</text>
                    <line x1="0" y1="35" x2="170" y2="35" stroke="var(--accent)" stroke-width="2"/>
                    <text x="0" y="80" class="body-text" width="420">
                        <tspan x="0" dy="0">We combined density functional theory (DFT) and</tspan>
                        <tspan x="0" dy="33.6">deep-learning-assisted molecular dynamics</tspan>
                        <tspan x="0" dy="33.6">simulations to investigate stretched PbTiO<tspan class="subscript">3</tspan></tspan>
                        <tspan x="0" dy="33.6">membranes. We analyzed the strain-driven</tspan>
                        <tspan x="0" dy="33.6">morphotropic phase boundary involving monoclinic</tspan>
                        <tspan x="0" dy="33.6">phases and their manifestation as diverse domain</tspan>
                        <tspan x="0" dy="33.6">structures at room temperature.</tspan>
                    </text>
                </g>
            </g>
            
            <!-- 右列 -->
            <g transform="translate(540, 0)">
                <!-- Key Insights -->
                <text x="0" y="0" class="section-title">Key Insights</text>
                <line x1="0" y1="35" x2="160" y2="35" stroke="var(--accent)" stroke-width="2"/>
                
                <!-- 要点列表 -->
                <g transform="translate(0, 80)" class="key-findings">
                    <!-- 第一条 -->
                    <g transform="translate(0, 0)">
                        <rect x="-15" y="-20" width="4" height="100" fill="var(--light-gray)"/>
                        <text x="10" y="0" width="410">
                            <tspan x="10" dy="0"><tspan class="key-findings strong">Mechanism of Enhancement:</tspan> The enhanced</tspan>
                            <tspan x="10" dy="30">piezoelectric response results from small-angle</tspan>
                            <tspan x="10" dy="30">rotations of dipoles at domain walls, a mechanism</tspan>
                            <tspan x="10" dy="30">distinct from the conventional polarization rotation</tspan>
                            <tspan x="10" dy="30">model.</tspan>
                        </text>
                    </g>
                    
                    <!-- 第二条 -->
                    <g transform="translate(0, 170)">
                        <rect x="-15" y="-20" width="4" height="100" fill="var(--light-gray)"/>
                        <text x="10" y="0" width="410">
                            <tspan x="10" dy="0"><tspan class="key-findings strong">The "Dipole Spiral":</tspan> We identified a ferroelectric</tspan>
                            <tspan x="10" dy="30">topological structure termed the "dipole spiral."</tspan>
                            <tspan x="10" dy="30">This helical structure possesses a rotational</tspan>
                            <tspan x="10" dy="30">zero-energy mode, unlocking possibilities for chiral</tspan>
                            <tspan x="10" dy="30">phonon dynamics.</tspan>
                        </text>
                    </g>
                    
                    <!-- 第三条 -->
                    <g transform="translate(0, 340)">
                        <rect x="-15" y="-20" width="4" height="80" fill="var(--light-gray)"/>
                        <text x="10" y="0" width="410">
                            <tspan x="10" dy="0"><tspan class="key-findings strong">Diverse Structures:</tspan> Simulations reveal</tspan>
                            <tspan x="10" dy="30">continuous distributions of dipole orientations and</tspan>
                            <tspan x="10" dy="30">mobile domain walls at room temperatures.</tspan>
                        </text>
                    </g>
                </g>
                
                <!-- 数据卡片 -->
                <g transform="translate(0, 520)">
                    <rect x="0" y="0" width="420" height="130" rx="4" fill="var(--primary)"/>
                    <text x="210" y="60" text-anchor="middle" class="stat-number">&gt; 320 pC/N</text>
                    <text x="210" y="100" text-anchor="middle" class="stat-label">Giant Intrinsic Piezoelectric Response</text>
                </g>
            </g>
        </g>
        
        <!-- Footer -->
        <g transform="translate(0, 980)">
            <line x1="0" y1="0" x2="960" y2="0" stroke="var(--border-color)" stroke-width="1"/>
            <text x="0" y="30" class="footer-text">Published 26 July 2024</text>
            <text x="960" y="30" text-anchor="end" class="footer-text">
                DOI: 
                <tspan class="doi-link">10.1103/PhysRevLett.133.046802</tspan>
            </text>
        </g>
    </g>
</svg>
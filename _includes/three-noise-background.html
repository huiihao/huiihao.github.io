<!-- Three.js Dual-Theme Noise Background -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ── GLSL Simplex noise ──
const noiseGLSL = /* glsl */ `
  vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

  float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy));
    vec2 x0 = v -   i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x  = a0.x  * x0.x  + h.x  * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
  }
`;

const vertexShader = /* glsl */ `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position, 1.0);
  }
`;

const fragmentShader = /* glsl */ `
  uniform float uTime;
  uniform float uTheme;   // 0=light, 1=dark (lerp)
  varying vec2 vUv;

  ${noiseGLSL}

  void main() {
    float t = uTime * 0.04;

    // multi-octave noise — larger features, more visible
    float n1 = snoise(vec2(vUv.x * 2.5 + t * 0.12, vUv.y * 2.5 - t * 0.10));
    float n2 = snoise(vec2(vUv.x * 5.5 - t * 0.18, vUv.y * 5.5 + t * 0.14));
    float n3 = snoise(vec2(vUv.x * 11.0 + t * 0.06, vUv.y * 11.0 - t * 0.08));
    float n = n1 * 0.55 + n2 * 0.30 + n3 * 0.15;  // range ≈ [-1, 1]

    // ── dark palette: deep navy → teal → muted cyan ──
    float dr = 0.04 + n * 0.06;
    float dg = 0.06 + n * 0.07;
    float db = 0.14 + n * 0.10;
    float da = 0.55 + n * 0.18;

    // ── light palette: warm cream → amber → muted rose ──
    float lr = 0.96 + n * 0.04;
    float lg = 0.94 + n * 0.05;
    float lb = 0.90 + n * 0.08;
    float la = 0.35 + n * 0.12;

    // lerp between palettes
    float r = mix(lr, dr, uTheme);
    float g = mix(lg, dg, uTheme);
    float b = mix(lb, db, uTheme);
    float a = mix(la, da, uTheme);

    // soft vignette
    float vignette = 1.0 - length(vUv - 0.5) * 1.0;
    a *= smoothstep(0.05, 1.0, vignette);

    gl_FragColor = vec4(r, g, b, a);
  }
`;

// ── Scene ──
const container = document.getElementById('three-bg');
if (!container) throw new Error('#three-bg not found');

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;

const uniforms = {
  uTime:  { value: 0 },
  uTheme: { value: 0.0 }   // start with light, update immediately
};

const material = new THREE.ShaderMaterial({
  vertexShader, fragmentShader, uniforms,
  transparent: true, depthTest: false, depthWrite: false
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

// ── Theme detection ──
function getTheme() {
  const html = document.documentElement;
  const mode = html.getAttribute('data-mode');
  if (mode === 'dark')  return 1.0;
  if (mode === 'light') return 0.0;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 1.0 : 0.0;
}

// smooth theme transition
let targetTheme = getTheme();
let currentTheme = targetTheme;

function updateTheme() {
  targetTheme = getTheme();
}

// observe mode changes
new MutationObserver(updateTheme).observe(document.documentElement, {
  attributes: true, attributeFilter: ['data-mode']
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);

// intercept mode-toggle button click
document.addEventListener('click', (e) => {
  const btn = e.target.closest('#mode-toggle');
  if (btn) setTimeout(updateTheme, 100);
});

// ── Animation ──
let animId;
function animate() {
  animId = requestAnimationFrame(animate);

  // lerp current → target theme
  currentTheme += (targetTheme - currentTheme) * 0.05;
  uniforms.uTheme.value = currentTheme;
  uniforms.uTime.value = performance.now() * 0.001;

  renderer.render(scene, camera);
}
animate();

// ── Resize ──
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Reduced motion ──
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
if (mq.matches) { cancelAnimationFrame(animId); container.style.display = 'none'; }
mq.addEventListener('change', (e) => {
  if (e.matches) { cancelAnimationFrame(animId); container.style.display = 'none'; }
  else { container.style.display = ''; animate(); }
});
</script>

<style>
#three-bg {
  position: fixed; inset: 0;
  z-index: -10; pointer-events: none;
  transition: opacity 0.6s ease;
}
[data-mode="dark"] #three-bg { background: #060e1a; }
[data-mode="light"] #three-bg,
html:not([data-mode]) #three-bg { background: #faf8f5; }
#three-bg canvas { display: block; }
</style>

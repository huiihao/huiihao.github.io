<!-- Three.js Simplex Noise Background -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ── 2D Simplex noise (GLSL) ──
const noiseGLSL = /* glsl */ `
  vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

  float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy));
    vec2 x0 = v -   i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x  = a0.x  * x0.x  + h.x  * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
  }
`;

const vertexShader = /* glsl */ `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position, 1.0);
  }
`;

const fragmentShader = /* glsl */ `
  uniform float uTime;
  uniform vec2 uResolution;
  varying vec2 vUv;

  ${noiseGLSL}

  void main() {
    float t = uTime * 0.03;

    // three octaves of noise for organic flow
    float n1 = snoise(vec2(vUv.x * 3.5 + t * 0.2, vUv.y * 3.5 - t * 0.15)) * 0.6;
    float n2 = snoise(vec2(vUv.x * 7.0 - t * 0.3, vUv.y * 7.0 + t * 0.25)) * 0.3;
    float n3 = snoise(vec2(vUv.x * 14.0 + t * 0.05, vUv.y * 14.0 + t * 0.1)) * 0.1;

    float n = n1 + n2 + n3; // range ≈ [-1, 1]

    // map noise to a warm-cool palette matching the site theme
    float r = 0.06 + n * 0.02;
    float g = 0.08 + n * 0.02;
    float b = 0.16 + n * 0.03;

    // subtle vignette
    float vignette = 1.0 - length(vUv - 0.5) * 1.2;
    vignette = smoothstep(0.0, 1.0, vignette);

    float alpha = 0.65 * vignette;

    gl_FragColor = vec4(r, g, b, alpha);
  }
`;

// ── Scene setup ──
const container = document.getElementById('three-bg');
if (!container) throw new Error('#three-bg not found');

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;

const uniforms = {
  uTime: { value: 0 },
  uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms,
  transparent: true,
  depthTest: false,
  depthWrite: false
});

const geometry = new THREE.PlaneGeometry(2, 2);
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

// ── Animation loop ──
let animId;
function animate() {
  animId = requestAnimationFrame(animate);
  uniforms.uTime.value = performance.now() * 0.001;
  renderer.render(scene, camera);
}
animate();

// ── Resize ──
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});

// ── Respect reduced motion ──
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
if (mq.matches) {
  cancelAnimationFrame(animId);
  container.style.display = 'none';
}
mq.addEventListener('change', (e) => {
  if (e.matches) {
    cancelAnimationFrame(animId);
    container.style.display = 'none';
  } else {
    container.style.display = '';
    animate();
  }
});
</script>

<style>
#three-bg {
  position: fixed;
  inset: 0;
  z-index: -10;
  pointer-events: none;
  background: #0a1628; /* fallback — matches the dipole spiral poster bg */
}
#three-bg canvas {
  display: block;
}
</style>
